name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the release
        uses: actions/checkout@v5

      - name: Verify version and package availability
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' server.json)"
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          init_version="$(python3 -c 'import pathlib, re; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/justfill_mcp/__init__.py").read_text()).group(1))')"
          gemini_version="$(jq -r '.version' gemini-extension.json)"
          registry_package_version="$(jq -r '.packages[0].version' server.json)"

          test "$version" = "$package_version"
          test "$version" = "$init_version"
          test "$version" = "$gemini_version"
          test "$version" = "$registry_package_version"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi

          curl -fsSL "https://pypi.org/pypi/justfill-mcp/${version}/json" |
            jq -e --arg version "$version" \
              '.info.version == $version and any(.info.requires_dist[]; test("^mcp<2"))'

          registry_response="$(curl -fsSL 'https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.mrmaciej1/justfill')"
          if jq -e --arg version "$version" \
            'any(.servers[]; .server.name == "io.github.mrmaciej1/justfill" and .server.version == $version)' \
            <<<"$registry_response" >/dev/null; then
            echo "already_published=true" >>"$GITHUB_OUTPUT"
          else
            echo "already_published=false" >>"$GITHUB_OUTPUT"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Install the pinned MCP publisher
        if: steps.preflight.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            'https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz' \
            -o mcp-publisher.tar.gz
          echo 'ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  mcp-publisher.tar.gz' |
            sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate registry metadata
        if: steps.preflight.outputs.already_published != 'true'
        run: ./mcp-publisher validate

      - name: Authenticate with GitHub OIDC
        if: steps.preflight.outputs.already_published != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish registry metadata
        if: steps.preflight.outputs.already_published != 'true'
        run: ./mcp-publisher publish

      - name: Verify the published version
        shell: bash
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            response="$(curl -fsSL 'https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.mrmaciej1/justfill')"
            if jq -e --arg version "$VERSION" \
              'any(.servers[];
                .server.name == "io.github.mrmaciej1/justfill"
                and .server.version == $version
                and ._meta["io.modelcontextprotocol.registry/official"].isLatest == true
              )' <<<"$response" >/dev/null; then
              echo "Verified io.github.mrmaciej1/justfill ${VERSION} as latest."
              exit 0
            fi
            sleep 5
          done
          echo "Registry did not expose ${VERSION} as latest within 60 seconds." >&2
          exit 1
